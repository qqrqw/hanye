server:
  port: 8081

spring:
  profiles:
    active: dev
  datasource:
    driver-class-name: ${hanye.datasource.driver-class-name}
    url: ${hanye.datasource.url}
    username: ${hanye.datasource.username}
    password: ${hanye.datasource.password}
  data:
    redis:
      host: ${hanye.redis.host}
      port: ${hanye.redis.port}
      password: ${hanye.redis.password}
      database: ${hanye.redis.database}

# ??mybatis
mybatis:
  #mapper????
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.entity
  configuration:
    # ??mybatis????????????
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # ??mybatis???????????  a_column = aColumn
    map-underscore-to-camel-case: true

login-reg:
  jwt:
    # 安全备注：下方为无效示例值，仅供占位；部署前必须替换，真实凭据不得提交到 Git。
    employee-secret-key: "FAKE_EXAMPLE_EMPLOYEE_SECRET_KEY_REPLACE_ME"
    employee-ttl: 864000000
    employee-token-name: Authorization
    # 安全备注：下方为无效示例值，仅供占位；部署前必须替换，真实凭据不得提交到 Git。
    user-secret-key: "FAKE_EXAMPLE_USER_SECRET_KEY_REPLACE_ME"
    user-ttl: 864000000
    user-token-name: Authorization

hanye:
  wechat:
    appid: ${hanye.wechat.appid}
    secret: ${hanye.wechat.secret}

  jwt:
    # 设置jwt签名加密时使用的秘钥
    # 安全备注：下方为无效示例值，仅供占位；部署前必须替换，真实凭据不得提交到 Git。
    admin-secret-key: "FAKE_EXAMPLE_ADMIN_SECRET_KEY_REPLACE_ME"
    # 设置jwt过期时间
    admin-ttl: 86400000
    # 设置前端传递过来的令牌名称
    admin-token-name: token
    # 安全备注：下方为无效示例值，仅供占位；部署前必须替换，真实凭据不得提交到 Git。
    user-secret-key: "FAKE_EXAMPLE_USER_SECRET_KEY_REPLACE_ME"
    user-ttl: 86400000
    user-token-name: authentication

  shop:
    address: 黑龙江省大庆市联想科技城
  baidu:
    # 安全备注：下方为无效示例值，仅供占位；部署前必须替换，真实凭据不得提交到 Git。
    ak: "FAKE_EXAMPLE_AK_REPLACE_ME"
